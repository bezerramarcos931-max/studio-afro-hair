<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Studio Afro Hair — Login</title>
  <style>
    body { background:#132114; color:#f5f5f0; font-family:sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; text-align:center; }
    .box { background:#1b2e1c; border:1px solid #d4a338; border-radius:24px; padding:32px 24px; max-width:360px; width:90%; }
    button { width:100%; padding:14px; border-radius:12px; border:none; background:#d4a338; color:#132114; font-weight:800; font-size:15px; cursor:pointer; margin-top:16px; }
  </style>
</head>
<body>
  <div class="box">
    <h2 style="color:#d4a338;margin:0">STUDIO AFRO HAIR</h2>
    <p id="st" style="font-size:13px;margin-top:12px">Pronto para conectar</p>
    <button id="btn">Entrar com Google</button>
  </div>
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>
  <script>
    firebase.initializeApp({
      apiKey: "AIzaSyDf2WEzBmcp2DPiqE8LLB5V9XDUoXr1UlE",
      authDomain: "://firebaseapp.com",
      projectId: "studio-afro-hair"
    });
    const auth = firebase.auth();
    const prov = new firebase.auth.GoogleAuthProvider();
    document.getElementById("btn").onclick = () => {
      document.getElementById("st").textContent = "Abrindo Google...";
      auth.signInWithPopup(prov).catch(e => {
        document.getElementById("st").textContent = "Erro: " + e.code + " - " + e.message;
      });
    };
    auth.onAuthStateChanged(u => {
      if (u) document.getElementById("st").textContent = "CONECTADO COM SUCESSO: " + u.email;
    });
  </script>
</body>
</html>
